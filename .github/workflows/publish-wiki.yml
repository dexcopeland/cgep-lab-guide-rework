# One-time setup: create any starter page in the Wiki UI so *.wiki.git exists,
# then run this workflow (workflow_dispatch) or push to main to publish.
name: Publish wiki

on:
  push:
    branches: [main]
    paths:
      - "*_rework.md"
      - "wiki-source/**"
      - "scripts/build-wiki.sh"
      - "scripts/test-build-wiki.sh"
      - ".github/workflows/publish-wiki.yml"
      - ".gitignore"
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pin to immutable SHA (v4.4.0); avoid floating @v4 with contents:write
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Build wiki staging directory
        run: |
          chmod +x scripts/build-wiki.sh scripts/test-build-wiki.sh
          ./scripts/test-build-wiki.sh

      - name: Require initialized wiki remote
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          host="${GITHUB_SERVER_URL#https://}"
          wiki_url="https://x-access-token:${GH_TOKEN}@${host}/${GITHUB_REPOSITORY}.wiki.git"
          if ! git ls-remote "$wiki_url" HEAD >/dev/null 2>&1; then
            echo "error: GitHub Wiki backend is not initialized yet." >&2
            echo >&2
            echo "The build succeeded, but publish needs ${GITHUB_REPOSITORY}.wiki.git," >&2
            echo "which GitHub only creates after the first Wiki page exists." >&2
            echo >&2
            echo "Fix (one-time):" >&2
            echo "  1. Open ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/wiki" >&2
            echo "  2. Create any starter page (title can be Home)" >&2
            echo "  3. Re-run this workflow (Actions → Publish wiki → Run workflow)" >&2
            exit 1
          fi
          echo "Wiki remote is reachable: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.wiki.git"

      - name: Publish to GitHub Wiki
        # Pin to immutable SHA (v5.0.6); do not use a floating @v5 tag with contents:write
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e
        with:
          path: .wiki-build
          strategy: clone
          disable-empty-commits: true
          # preprocess true is fine; pages already use [[Wiki Links]]
